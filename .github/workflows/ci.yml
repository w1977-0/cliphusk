name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pure-core tests
        run: node --test test/cliplib.test.js
      - name: Build renderer (inline core)
        run: node build.js
      - name: Install Electron (dev dependency)
        run: npm install --no-save electron@44
      - name: Self-test (real clipboard, system-verified)
        shell: bash
        run: |
          npx electron . --selftest || code=$?
          cat "$HOME/Library/Application Support/cliphusk/selftest.json" 2>/dev/null || cat "$APPDATA/cliphusk/selftest.json" 2>/dev/null || true
          exit ${code:-0}
      - name: Package portable app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # portable layout: rename the dist bundle, put app sources in Resources/app
          cp -R node_modules/electron/dist/Electron.app out/cliphusk.app
          rm -rf out/cliphusk.app/Contents/Resources/default_app.asar
          mkdir -p out/cliphusk.app/Contents/Resources/app
          cp -R main.js preload.js renderer.html cliplib.js package.json out/cliphusk.app/Contents/Resources/app/
          # dock icon identity
          defaults write out/cliphusk.app/Contents/Info CFBundleIdentifier org.w1977.cliphusk 2>/dev/null || true
          cd out && zip -qry cliphusk-mac.zip cliphusk.app
      - name: Package portable app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dist = "node_modules/electron/dist"
          New-Item -ItemType Directory -Force "resources/app" | Out-Null
          Copy-Item main.js,preload.js,renderer.html,cliplib.js,package.json resources/app/
          Remove-Item "$dist/resources/default_app.asar" -ErrorAction SilentlyContinue
          Copy-Item -Recurse resources $dist/resources/
          Compress-Archive -Path "$dist/*" -DestinationPath cliphusk-win.zip -Force
          New-Item -ItemType Directory -Force out | Out-Null
          Move-Item cliphusk-win.zip out/
      - uses: actions/upload-artifact@v4
        with:
          name: cliphusk-${{ matrix.os }}
          path: out/*.zip
