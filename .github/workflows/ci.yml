name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pure-core tests
        run: node --test test/cliplib.test.js
      - name: Build renderer (inline core)
        run: node build.js
      - name: Install Electron (dev dependency)
        run: npm install --no-save electron@44
      - name: Self-test (real clipboard, system-verified)
        shell: bash
        run: |
          npx electron . --selftest || code=$?
          cat "$HOME/Library/Application Support/cliphusk/selftest.json" 2>/dev/null || cat "$APPDATA/cliphusk/selftest.json" 2>/dev/null || true
          exit ${code:-0}
      - name: Package portable app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p out/cliphusk.app/Contents/Resources/app
          cp -R node_modules/electron/dist/Electron.app out/cliphusk.app 2>/dev/null || true
          cp -R node_modules/electron/dist/* out/cliphusk.app/Contents/ 2>/dev/null || true
          cp -R main.js preload.js renderer.html cliplib.js package.json out/cliphusk.app/Contents/Resources/app/
          cd out && zip -qry cliphusk-mac.zip cliphusk.app
      - name: Package portable app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/app | Out-Null
          Copy-Item -Recurse main.js,preload.js,renderer.html,cliplib.js,package.json out/app/
          Copy-Item -Recurse node_modules/electron/dist/* out/
          Rename-Item out/resources out/app2 -ErrorAction SilentlyContinue
          if (Test-Path out/resources) { Copy-Item -Recurse out/resources out/app2 }
          # Electron portable: resources/app + electron.exe renamed
          if (Test-Path out/resources/default_app.asar) { Remove-Item out/resources/default_app.asar }
          Copy-Item -Recurse out/app out/resources/cliphusk-app -ErrorAction SilentlyContinue
          # use the electron.exe directly with our app injected
          Rename-Item out/electron.exe cliphusk.exe -ErrorAction SilentlyContinue
          Compress-Archive -Path out/* -DestinationPath cliphusk-win.zip -Force
          Move-Item cliphusk-win.zip out/cliphusk-win.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cliphusk-${{ matrix.os }}
          path: out/*.zip
